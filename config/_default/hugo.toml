baseURL = "http://localhost:1313/"
locale = "pt-BR"
title = "Papo Whovian"
defaultContentLanguage = "pt"

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  description = "Sua biblioteca nacional sobre tudo o que rola no universo de Doctor Who"
  logo = "/images/logo-papo-whovian.png"
  favicon = "/images/favico.png"
  sliderImage = "/images/sky-828648_1920.jpg"
  sliderTitle = "Papo Whovian"
  sliderText = "Sua biblioteca nacional sobre tudo o que rola no universo de Doctor Who. Aqui, nosso objetivo é divulgar a série fazendo com que cada vez mais pessoas se aproximem dessa série incrível. Então fique à vontade para entrar na nossa TARDIS e viajar pelo tempo e espaço com a gente!!"
  facebook = "https://www.facebook.com/papowhovian"
  twitter = "https://twitter.com/papowhovian"
  tumblr = ""
  disqusShortname = ""

