<header class="site-header" role="banner">
  <div class="header-inner">

    <div class="header-logo">
      <a href="{{ .Site.BaseURL }}" aria-label="{{ .Site.Title }}">
        <img
          src="{{ "logo-papo-whovian.png" | relURL }}"
          alt="{{ .Site.Title }}"
          width="229"
          height="96"
        />
      </a>
    </div>

    <nav class="main-nav" aria-label="Menu principal">
      <ul class="nav-menu" role="menubar">
        <li class="nav-item{{ if .IsHome }} is-active{{ end }}" role="menuitem">
          <a href="{{ .Site.BaseURL }}" class="nav-link">HOME</a>
        </li>
        {{ range .Site.Taxonomies.categories.Alphabetical }}
          {{ $active := hasPrefix $.RelPermalink .Page.RelPermalink }}
          <li class="nav-item{{ if $active }} is-active{{ end }}" role="menuitem">
            <a href="{{ .Page.RelPermalink }}" class="nav-link">{{ .Page.Title }}</a>
          </li>
        {{ end }}
      </ul>
    </nav>

    <button class="mobile-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="mobile-nav">
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>

  <nav class="mobile-nav" id="mobile-nav" aria-label="Menu mobile" aria-hidden="true">
    <ul class="mobile-menu">
      <li><a href="{{ .Site.BaseURL }}">HOME</a></li>
      {{ range .Site.Taxonomies.categories.Alphabetical }}
      <li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a></li>
      {{ end }}
    </ul>
  </nav>
</header>
