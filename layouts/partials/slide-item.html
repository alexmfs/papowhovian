<div class="slide-item">
  <a class="slide-item-link" href="{{ .RelPermalink }}">
    {{ with .Params.thumbnail }}
    <img src="{{ . | relURL }}" alt="{{ $.Title }}" loading="lazy" />
    {{ else }}
    <div class="slide-item-img-placeholder"></div>
    {{ end }}
  </a>
  <div class="slide-item-overlay">
    <h2 class="slide-item-title">{{ .Title }}</h2>
    <div class="slide-item-excerpt">{{ .Summary }}</div>
  </div>
</div>
