<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}" prefix="og: http://ogp.me/ns#">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} &ndash; {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else with .Params.excerpt }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
  <link rel="shortcut icon" href="{{ "/images/favico.png" | relURL }}" />
  <!-- Google Fonts: Open Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nixie+One&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <!-- Styles -->
  <link rel="stylesheet" href="{{ "/css/main.css" | relURL }}" />
  <!-- Open Graph -->
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}" />
  <meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}" />
  <meta property="og:url" content="{{ .Permalink }}" />
  <meta property="og:site_name" content="{{ .Site.Title }}" />
  {{ with .Params.thumbnail }}<meta property="og:image" content="{{ . | absURL }}" />{{ end }}
  {{ with .Site.Params.description }}<meta property="og:description" content="{{ . }}" />{{ end }}
  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="{{ "/feed.xml" | absURL }}" />
</head>
<body{{ if .IsHome }} class="page-home"{{ end }}>

  {{ partial "header.html" . }}

  <main id="main" role="main">
    <section class="page">
      {{ block "main" . }}{{ end }}
    </section>
  </main>

  {{ partial "pre-footer.html" . }}
  {{ partial "footer.html" . }}

  <script src="{{ "/js/main.js" | relURL }}"></script>
</body>
</html>
